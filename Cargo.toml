[workspace]
resolver = "2"
members = [
    "crates/canrush-core",
    "crates/canrush-cli",
    "crates/canrush-server",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hiroyuki/CANRush"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
